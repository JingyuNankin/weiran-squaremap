<!doctype html>
<html lang="zh-Hans">
    <head>
        <title>轨道交通示意图</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
        <meta name="theme-color" content="#0e1520" />
        <meta name="description" content="蔚然轨道交通示意图" />
        <link rel="shortcut icon" href="favicon.ico" sizes="256x256" crossorigin="anonymous" />
        <script type="module" src="src/schematic/main.js"></script>
    </head>
    <body>
        <header class="schematic-header">
            <div class="schematic-header-text">
                <h1 class="schematic-title">轨道交通示意图</h1>
                <p class="schematic-note">本图为变形图，只表示大致位置，不表示精确坐标。</p>
            </div>
        </header>

        <div class="schematic-controls">
            <div class="schematic-zoom" role="group" aria-label="缩放">
                <button type="button" class="schematic-zoom-btn" data-zoom="in" aria-label="放大" title="放大">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z" /></svg>
                </button>
                <button type="button" class="schematic-zoom-btn" data-zoom="out" aria-label="缩小" title="缩小">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19 13H5v-2h14z" /></svg>
                </button>
            </div>
            <div class="schematic-toolbar">
                <button type="button" class="schematic-tool-btn" data-panel="search" aria-label="搜索" title="搜索">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14" /></svg>
                </button>
                <a class="schematic-tool-btn" id="schematic-satellite-link" href="./index.html" aria-label="卫星图" title="卫星图">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2m-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39" /></svg>
                </a>
                <button type="button" class="schematic-tool-btn" data-panel="settings" aria-label="设置" title="设置">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7 7 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.55-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.43.34.69.22l2.39-.96c.5.39 1.04.7 1.63.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.5-.42l.36-2.54c.59-.24 1.13-.55 1.63-.94l2.39.96c.25.12.55.02.69-.22l1.92-3.32a.5.5 0 0 0-.12-.64zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2" /></svg>
                </button>
            </div>
        </div>

        <div id="schematic-search" class="schematic-search" hidden>
            <div class="schematic-search-shell">
                <div class="schematic-search-input-wrap">
                    <svg class="schematic-search-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14" /></svg>
                    <input id="schematic-search-input" class="schematic-search-input" type="search" placeholder="搜索站点…" aria-label="搜索关键词" autocomplete="off" />
                </div>
                <div id="schematic-search-results" class="schematic-search-results" hidden role="listbox" aria-label="搜索结果"></div>
            </div>
        </div>

        <aside id="schematic-settings" class="schematic-settings" hidden>
            <p class="schematic-settings-heading">主题</p>
            <div id="schematic-skin-list" class="schematic-skin-list" role="radiogroup" aria-label="主题"></div>
            <hr class="schematic-settings-divider" />
            <p class="schematic-settings-heading">关于</p>
            <p class="schematic-settings-name">蔚然GIS</p>
            <p id="schematic-settings-version" class="schematic-settings-version"></p>
            <p id="schematic-settings-built" class="schematic-settings-meta" hidden></p>
            <p class="schematic-settings-meta">轨道交通示意图</p>
        </aside>

        <div id="schematic-root"></div>
        <button type="button" id="schematic-detail-scrim" class="schematic-detail-scrim" hidden aria-label="关闭详情"></button>
        <aside id="schematic-detail" class="schematic-detail" hidden role="dialog" aria-modal="true" aria-label="站点详情">
            <div class="schematic-detail-handle" aria-hidden="true"></div>
            <div class="schematic-detail-header">
                <span class="schematic-detail-title"></span>
                <button type="button" class="schematic-detail-close" aria-label="关闭">×</button>
            </div>
            <div class="schematic-detail-body">
                <p class="schematic-detail-org-path" hidden></p>
                <div class="schematic-detail-meta-row">
                    <span class="schematic-detail-layer"></span>
                    <span class="schematic-detail-coords"></span>
                </div>
                <a class="schematic-detail-link" href="./index.html">在卫星图中查看</a>
            </div>
        </aside>
    </body>
</html>
